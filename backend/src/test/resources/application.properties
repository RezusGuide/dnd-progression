# Test-only config: in-memory H2 in PostgreSQL mode, so `./gradlew build`
# never needs (or touches) the real Neon database. NON_KEYWORDS: roles.key
# is a reserved word in H2 but a plain column name in Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

# Base64 of a test-only phrase (JwtService decodes the key, like the real
# JWT_SECRET). Long enough for HS384. Not used anywhere real.
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZS0wMTIzNDU2Nzg5
cors.allowed-origins=
jwt.expiration=86400000

# This file shadows src/main/resources/application.properties on the test
# classpath, so anything the app reads with no default has to be repeated here.
spring.application.name=dnd-progression-backend-test
