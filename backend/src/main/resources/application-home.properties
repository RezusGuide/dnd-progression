# Home hosting (docs/zlatopryady/HOME-HOSTING.md), on top of prod:
# SPRING_PROFILES_ACTIVE=prod,home.

# Listen on this PC only; Tailscale Funnel carries requests in from outside,
# other devices in the home network cannot reach the backend directly.
server.address=127.0.0.1

# Logs in %LOCALAPPDATA%\zlatopryady\logs, rotated at 10 MB, about five files kept.
logging.file.name=${LOCALAPPDATA:.}/zlatopryady/logs/backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=50MB
