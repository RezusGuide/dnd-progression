spring.application.name=dnd-progression-backend
server.port=${PORT:8080}

# Set these as real environment variables on Railway (and in a local .env /
# your shell for dev) - see the root README. The defaults below only work
# against a Postgres you're running locally; they are NOT the production
# Neon database.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dnd_progression}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.security.user.name=disabled
spring.security.user.password=disabled

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:ZG5kLXByb2dyZXNzaW9uLWRldi1vbmx5LWNoYW5nZS1tZQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated. Add your Vercel URL here once you have one.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
