spring.application.name=dnd-progression-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://REDACTED-NEON-HOST/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=REDACTED-NEON-PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.security.user.name=disabled
spring.security.user.password=disabled

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=REDACTED-JWT-SECRET-BASE64=
jwt.expiration=86400000